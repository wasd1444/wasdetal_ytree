<!doctype html><html><head><meta charset="utf-8"><title>Y-DNA tree: Y-Adam</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><script>(function(){try{var t=localStorage.getItem('ytree-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}})();</script><style>
:root{--page:#e3e4e5;--bg:#f2f2f2;--fg:#333;--mut:#888;--green:#008000;--gold:#f7c600;--chip:#d6e7f3;--more:#ddd;--line:#999;--anc:#fbdcc4;--samp:#008000}
:root[data-theme="dark"]{--page:#111;--bg:#1c1c1c;--fg:#ddd;--mut:#999;--chip:#23394a;--more:#3a3a3a;--line:#777;--anc:#5a3a22;--samp:#5fd35f}
body{font-family:Arial,Helvetica,sans-serif;background:var(--page);color:var(--fg);margin:0;padding:12px}
.topbar{background:var(--gold);display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 26px;font-size:20px;color:#222}
.brand{margin-right:18px}
.vbtn,.tbtn,.stat{background:#eabf3f;border:1px solid #dba912;color:#7d6b2a;font-size:17px;padding:4px 10px}
.vbtn,.tbtn{cursor:pointer}.vbtn.on,.tbtn.on{background:#fff7d1;border-color:#fff7d1;color:#222}
.tbtn:disabled{opacity:.45;cursor:default}
.sep{width:14px}.statusmsg{font-size:15px;color:#7d6b2a}
.spacer{flex:1}
.crumbs{display:flex;flex-wrap:wrap;gap:5px;padding:16px 26px 14px}
.crumb{padding:3px 10px;border:0;background:#fff;color:#333;font:16px Arial,Helvetica,sans-serif;cursor:pointer}
.crumb:hover{background:#fff7d1}
.crumb.on{background:var(--gold);color:#222}
.crumb.dim{opacity:.55}
.panel{background:var(--bg);padding:26px 30px}
.view{display:none;overflow-x:auto;padding-bottom:160px}.view.on{display:block}
.clade{background:var(--green);color:#fff;padding:2px 7px;font-size:16px;white-space:nowrap}
.clade.root{background:var(--gold);color:#222}
.clade[data-id],.nh[data-id]{cursor:pointer}
.snps{color:var(--mut);font-size:14px}
.more{background:var(--more);color:var(--mut);padding:1px 6px;font-size:13px}
.dates{background:var(--chip);color:var(--mut);padding:1px 6px;font-size:13px}
.sample{background:rgba(0,128,0,.12);color:var(--samp);padding:1px 5px;font-size:14px}
.sample.ancient{background:var(--anc);color:#b4541a}
.where{color:var(--mut);font-size:13px;padding:0 2px}
.lang{background:#fff;color:#777;padding:0 5px;font-size:12px}
[data-tip]{position:relative}
[data-tip]:hover{background:#fbf3c4;color:#555}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:10px;background:#222;color:#fff;padding:6px 12px;border-radius:5px;font-size:15px;line-height:1.2;white-space:pre;line-height:1.35;z-index:50;pointer-events:none}
[data-tip]:hover::before{content:'';position:absolute;left:100%;top:50%;transform:translateY(-50%);border:5px solid transparent;border-right-color:#222;z-index:50;pointer-events:none}
.clan{background:#f3dfc9;color:#7a4a10;padding:0 5px;font-size:12px}
.fg{display:inline-block;padding:0 3px;border-radius:2px}
.fg[data-tip]:hover::after{left:50%;top:100%;transform:translateX(-50%);margin:6px 0 0;font-size:14px;text-align:left}
.fg[data-tip]:hover::before{left:50%;top:100%;transform:translateX(-50%);margin:-4px 0 0;border-color:transparent;border-bottom-color:#222}
.flag{width:21px;height:14px;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.cc{font-size:11px;border:1px solid var(--line);padding:0 3px}
details.info{display:inline-block;vertical-align:top;font-size:12px;color:var(--mut)}
details.info summary{cursor:pointer;display:inline}
details.info .box{background:var(--bg);border:1px solid var(--line);padding:6px 8px;text-align:left;max-width:420px;position:relative;z-index:5;color:var(--fg);white-space:normal}
.classic ul{list-style:none;margin:0;padding-left:9px}
.classic>ul{padding-left:0}
.classic li{position:relative;padding:5px 0 3px 27px}
.classic li::before{content:'';position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--line)}
.classic li::after{content:'';position:absolute;left:0;top:17px;width:24px;border-top:1px solid var(--line)}
.classic li:last-child::before{bottom:auto;height:17px}
.classic>ul>li{padding-left:0}.classic>ul>li::before,.classic>ul>li::after{display:none}
.chart ul{display:flex;justify-content:center;padding:20px 0 0;margin:0;position:relative}
.chart>ul{padding-top:0}
.chart li{list-style:none;text-align:center;position:relative;padding:20px 6px 0}
.chart>ul>li{padding-top:0}
.chart li::before,.chart li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid var(--line);width:50%;height:20px}
.chart li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.chart>ul>li::before,.chart>ul>li::after{display:none}
.chart li:only-child::before,.chart li:only-child::after{display:none}
.chart li:only-child{padding-top:0}
.chart li:first-child::before,.chart li:last-child::after{border:0 none}
.chart li:last-child::before{border-right:2px solid var(--line);border-radius:0 5px 0 0}
.chart li:first-child::after{border-radius:5px 0 0 0}
.chart ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--line);height:20px}
.node{display:inline-block;min-width:150px;background:#ddd;color:#555;border:1px solid #ccc;border-radius:3px;text-align:center;font-size:13px}
:root[data-theme="dark"] .node{background:#2c2c2c;color:#bbb;border-color:#444}
:root[data-theme="dark"] .sample.ancient{color:#f0a070}
:root[data-theme="dark"] .lang{background:#3a3a3a;color:#ccc}
.nh{background:var(--green);color:#fff;font-size:16px;padding:3px 8px}.gold .nh{background:var(--gold);color:#222}
.ns{padding:3px}.nd{background:var(--chip);padding:4px;color:var(--mut);font-size:12px;min-height:14px}
.nf{min-height:18px;padding:4px 2px;font-size:13px}
.ed{display:none;margin-left:6px;white-space:nowrap}
body.editing .ed{display:inline-block}
body.editing .node .ed{display:block;padding:3px 2px 5px;margin:0;white-space:normal}
.eb{font:11px Arial,Helvetica,sans-serif;padding:1px 6px;margin:0 2px;border:1px solid #aaa;background:#fff;color:#333;cursor:pointer;border-radius:3px}
.eb:hover{background:#fff7d1}.eb.del{color:#b00020}.eb.big{font-size:14px;padding:4px 12px}
.editbar{display:none;padding:8px 26px;font-size:14px;color:#555;background:#fff7d1}
body.editing .editbar{display:block}
.warnbox{margin:0 26px 8px;font-size:13px;background:#fff7d1;border:1px solid #e6cf6a;padding:4px 10px;color:#6b5a14}
.warnbox summary{cursor:pointer}.warnbox div{padding:2px 0;white-space:pre-wrap}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal[hidden]{display:none}
.dlg{background:#fff;color:#222;padding:18px 22px;border-radius:6px;min-width:440px;max-width:92vw;max-height:90vh;overflow:auto}
.dlg h3{margin:0 0 12px;font-size:17px}
.fgrid{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center}
.fgrid label{font-size:14px;color:#555}
.fq{margin-bottom:5px}
.fgrid select[size]{height:auto}
.fgrid input,.fgrid select{font:14px Arial,Helvetica,sans-serif;padding:5px 7px;border:1px solid #bbb;border-radius:3px;width:100%;box-sizing:border-box}
.merr{color:#b00020;font-size:13px;min-height:18px;margin-top:10px}
.mbtns{text-align:right;margin-top:6px}
.tg{display:inline-block;width:16px;color:var(--mut);cursor:pointer;user-select:none;font-size:13px;text-align:center}
.tg:hover{color:var(--fg)}
.nh .tg{color:#fff;opacity:.85;margin-right:3px}.gold .nh .tg{color:#222}
.searchov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:120;display:flex;align-items:flex-start;justify-content:center;padding-top:60px}
.searchov[hidden]{display:none}
.spanel{position:relative;background:var(--page);color:var(--fg);width:min(1000px,94vw);max-height:80vh;overflow:auto;padding:26px 28px;border:1px solid var(--line)}
.shead{background:var(--gold);color:#222;font-size:17px;padding:10px 16px}
.sform{background:rgba(128,128,128,.25);padding:12px 16px;font-size:16px;margin-bottom:18px}
.sform input{font:16px Arial,Helvetica,sans-serif;padding:5px 8px;width:260px;border:1px solid #aaa}
.sform button,.sclose{font:16px Arial,Helvetica,sans-serif;padding:5px 12px;cursor:pointer;border:1px solid #aaa;background:#eee;color:#111;border-radius:3px}
.sclose{position:absolute;top:0;right:0;border:0;background:#fff;font-size:20px;padding:6px 12px;border-radius:0}
.stable{width:100%;border-collapse:collapse;background:var(--bg)}
.stable td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:16px}
.stable td:last-child{width:45%}
.stable .clade{cursor:pointer}
.snone{padding:8px 4px;color:var(--mut);font-size:15px}
</style></head><body>

    +(col?'<span class="more">\u2026 '+hiddenTxt(id)+' hidden</span> ':'')+infoN(n)+edN(id);
  if(col)return '<li>'+head+'</li>';
  const sl=n.s.map(s=>'<li>'+sampleLine(s)+'</li>'), cl=n.k.map(k=>classicLi(k,false));
  let inner;
  if(sl.length&&cl.length)inner='<li><span class="clade">'+E(n.n)+'*</span><ul>'+sl.join('')+'</ul></li>'+cl.join('');
  else inner=sl.join('')+cl.join('');
  return '<li>'+head+(inner?'<ul>'+inner+'</ul>':'')+'</li>';}
function chartLi(id,isRoot){
  const n=N[id],si=snpInfo(n),cnt={},has=n.k.length||n.s.length,col=has&&collapsed.has(nk(n));
  n.s.forEach(s=>{const c=s.c||{},k=c.show||c.rc||'?';const o=(cnt[k]=cnt[k]||{c:c,n:0,t:[]});o.n++;o.t.push((s.l||'(no ID)')+(s.lg?' \u00b7 '+(s.lgn?s.lgn+' ('+s.lg+')':s.lg):''));});
  const fl=Object.values(cnt).map(o=>'<span class="fg" data-tip="'+E(o.t.join('\n'))+'">'+(flag(o.c,true)||'<span class="cc">'+(E(o.c.show)||'?')+'</span>')+' '+o.n+'</span>').join(' ');
  const b='<div class="node'+(isRoot?' gold':'')+'"><div class="nh" data-id="'+id+'" title="Focus on '+E(n.n)+'">'+(has?'<span class="tg" data-tg="'+id+'" title="'+(col?'Expand':'Collapse')+'">'+(col?'\u25b8':'\u25be')+'</span>':'')+E(n.n)+'</div>'
    +'<div class="ns">'+((si.total?si.total+' SNPs':'')+(col?(si.total?' \u00b7 ':'')+hiddenTxt(id)+' hidden':'')||'&nbsp;')+'</div>'
    +'<div class="nd">'+(n.y!=null?'TMRCA '+fmt(n.y)+' ybp<br>('+E(n.ds)+')':'')+'</div>'
    +'<div class="nf">'+fl+'</div>'+infoN(n)+edN(id)+'</div>';
  const kids=col?'':n.k.map(k=>chartLi(k,false)).join('');
  return '<li>'+b+(kids?'<ul>'+kids+'</ul>':'')+'</li>';}
/* ------------------------------------------------------------ editing (needs the local server) */
function splitPath(s){return String(s||'').split('>').map(x=>x.trim()).filter(Boolean);}
const samePath=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);
const startsWith=(p,pre)=>p.length>=pre.length&&pre.every((x,i)=>p[i]===x);
function idByPath(p){let list=ROOTS,cur=-1;for(const nm of p){const f=list.find(i=>N[i].n===nm);if(f===undefined)return -1;cur=f;list=N[f].k;}return cur;}
function isUnder(id,anc){while(id!==-1){if(id===anc)return true;id=N[id].par;}return false;}
function edN(id){return SERVER?'<span class="ed"><button class="eb" data-act="editN" data-nid="'+id+'" title="Rename or change this subclade">edit</button><button class="eb" data-act="addN" data-nid="'+id+'" title="Add a subclade below this one">+ subclade</button><button class="eb" data-act="addS" data-nid="'+id+'" title="Add a modern or ancient sample to this subclade">+ sample</button><button class="eb del" data-act="delN" data-nid="'+id+'" title="Delete this subclade and everything below it">delete</button></span>':'';}
function edS(ri){return SERVER?'<span class="ed"><button class="eb" data-act="editS" data-ri="'+ri+'">edit</button><button class="eb del" data-act="delS" data-ri="'+ri+'">delete</button></span>':'';}
function optLabel(i){const n=N[i],up=n.p.slice(0,-1).reverse();return n.n+(up.length?'   \u2039 '+up.slice(0,4).join(' \u2039 ')+(up.length>4?' \u2026':''):'');}
function nodeOptions(excl){const o=[];const w=i=>{if(i===excl)return;o.push([String(i),optLabel(i),N[i].p.join(' > ')]);N[i].k.forEach(w);};ROOTS.forEach(w);return o;}
function optHtml(opts,sel,t){t=(t||'').toLowerCase();return opts.filter(o=>!t||(o[2]||o[1]).toLowerCase().indexOf(t)>=0).map(o=>'<option value="'+E(o[0])+'"'+(String(o[0])===String(sel)?' selected':'')+' title="'+E(o[2]||o[1])+'">'+E(o[1])+'</option>').join('');}
function mkRow(type,path,f){const r={};COLS.forEach(c=>r[c]='');r.type=type;r.path=path.slice();return Object.assign(r,f||{});}
function fNode(v){return {label:'',other_snps:v.other.trim(),tmrca_ybp:v.tmrca.trim(),country:v.country.trim(),region:v.region.trim(),language:v.language.trim(),notes:v.notes.trim()};}
function fSample(v){return {label:v.label.trim(),tmrca_ybp:v.tmrca.trim(),country:v.country.trim(),region:v.region.trim(),language:v.language.trim(),notes:v.notes.trim()};}
function geoFields(g){return [{id:'country',label:'Country',value:g('country'),ph:'Albania, AL or ALB'},{id:'region',label:'Region',value:g('region'),ph:'Elbasan or AL-03'},{id:'language',label:'Language (ISO 639-3)',value:g('language'),ph:'sqi, bul, srp ...'},{id:'notes',label:'Notes',value:g('notes'),ph:'tribe, clan, noble family ...'}];}
function closeModal(){const m=document.getElementById('modal');m.hidden=true;m.innerHTML='';}
function openForm(title,fields,onOk){
  const m=document.getElementById('modal');
  let h='<div class="dlg"><h3>'+E(title)+'</h3><div class="fgrid">';
  fields.forEach(f=>{h+='<label for="f_'+f.id+'">'+E(f.label)+'</label>';
    if(f.options){const big=f.options.length>12;
      h+='<div>'+(big?'<input id="f_'+f.id+'_q" class="fq" placeholder="type to filter ('+f.options.length+' choices)..." autocomplete="off">':'')
        +'<select id="f_'+f.id+'"'+(big?' size="8"':'')+'>'+optHtml(f.options,f.value,'')+'</select></div>';}
    else h+='<input id="f_'+f.id+'" value="'+E(f.value||'')+'" placeholder="'+E(f.ph||'')+'" autocomplete="off">';});
  h+='</div><div class="merr" id="merr"></div><div class="mbtns"><button class="eb big" id="mok">OK</button><button class="eb big" id="mcancel">Cancel</button></div></div>';
  m.innerHTML=h;m.hidden=false;
  document.getElementById('mcancel').onclick=closeModal;
  fields.forEach(f=>{if(f.options&&f.options.length>12){
    const q=document.getElementById('f_'+f.id+'_q'),sel=document.getElementById('f_'+f.id);
    const show=()=>{const o=sel.selectedOptions[0];if(o&&o.scrollIntoView)o.scrollIntoView({block:'nearest'});};show();
    q.oninput=()=>{const cur=sel.value;sel.innerHTML=optHtml(f.options,cur,q.value);if(!sel.value&&sel.options.length)sel.selectedIndex=0;show();};}});
  document.getElementById('mok').onclick=()=>{const v={};fields.forEach(f=>v[f.id]=document.getElementById('f_'+f.id).value);
    const bad=fields.find(f=>f.options&&v[f.id]==='');if(bad){document.getElementById('merr').textContent='Choose an option for "'+bad.label+'" (nothing matches your filter).';return;}
    const res=onOk(v);if(res.err){document.getElementById('merr').textContent=res.err;return;}closeModal();commit(res.hint);};
  const first=m.querySelector('input,select');if(first)first.focus();}
function formNode(mode,nid){
  if(!SERVER)return;if(!EDITABLE){alert(EDIT_MSG);return;}
  const edit=mode==='edit',n=nid>=0?N[nid]:null,row=edit&&n.ri>=0?ROWS[n.ri]:null,g=k=>row?(row[k]||''):'';
  const parent=edit?n.par:nid;
  const fields=[{id:'name',label:'Name',value:edit?n.n:'',ph:'e.g. E-FTC12111'},
    {id:'parent',label:'Parent subclade',value:String(parent),options:[['-1','(top level)']].concat(nodeOptions(edit?nid:undefined))},
    {id:'other',label:'SNPs',value:g('other_snps'),ph:'separate with ;  e.g. FTC12111;Y332597'},
    {id:'tmrca',label:'TMRCA (ybp)',value:g('tmrca_ybp'),ph:'years before present'}].concat(geoFields(g));
  openForm(edit?'Edit subclade '+n.n:(n?'Add subclade under '+n.n:'Add top-level subclade'),fields,v=>applyNode(mode,nid,v));}
function applyNode(mode,nid,v){
  const name=v.name.trim();if(!name)return {err:'Name is required.'};if(name.indexOf('>')>=0)return {err:'The name cannot contain ">".'};
  const pid=+v.parent,parentPath=pid<0?[]:N[pid].p,newPath=parentPath.concat([name]),cur=focus===-1?[]:N[focus].p.slice();
  if(mode==='add'){const ex=idByPath(newPath);if(ex>=0&&N[ex].ri>=0)return {err:newPath.join(' > ')+' already exists.'};
    ROWS.push(mkRow('subclade',newPath,fNode(v)));return {hint:cur};}
  const old=N[nid].p;
  if(!samePath(old,newPath)){
    if(pid>=0&&isUnder(pid,nid))return {err:'A subclade cannot be moved under itself.'};
    if(idByPath(newPath)>=0)return {err:'A subclade with that name already exists under that parent.'};
    ROWS.forEach(r=>{if(startsWith(r.path,old))r.path=newPath.concat(r.path.slice(old.length));});}
  let row=ROWS.find(r=>r.type==='subclade'&&samePath(r.path,newPath));
  if(row)Object.assign(row,fNode(v));
  else{row=mkRow('subclade',newPath,fNode(v));const at=ROWS.findIndex(r=>startsWith(r.path,newPath));if(at<0)ROWS.push(row);else ROWS.splice(at,0,row);}
  return {hint:startsWith(cur,old)?newPath.concat(cur.slice(old.length)):cur};}
function formSample(mode,nid,ri){
  if(!SERVER)return;if(!EDITABLE){alert(EDIT_MSG);return;}
  const edit=mode==='edit',row=edit?ROWS[ri]:null,g=k=>row?(row[k]||''):'';
  const pid=edit?idByPath(row.path):nid;
  const fields=[{id:'type',label:'Type',value:edit?row.type:'modern',options:[['modern','modern sample'],['ancient','ancient sample']]},
    {id:'label',label:'Sample ID',value:g('label'),ph:'e.g. YF126165'},
    {id:'parent',label:'Subclade',value:String(pid),options:nodeOptions()},
    {id:'tmrca',label:'Date',value:dateFromCell(g('tmrca_ybp')),ph:'e.g. 1500 AC or 850 BC'}].concat(geoFields(g));
  openForm(edit?'Edit sample '+g('label'):'Add sample to '+N[nid].n,fields,v=>applySample(mode,ri,v));}
function yearLabel(ybp){const y=PRESENT-ybp;return y>=1?y+' '+ERA_A:(1-y)+' '+ERA_B;}
function parseDate(t){
  t=t.trim().replace(/,/g,'');if(!t)return '';
  let m=/^(?:(AD|AC|CE|BC|BCE)\s*(\d+)|(\d+)\s*(AD|AC|CE|BC|BCE))$/i.exec(t);
  if(m){const era=(m[1]||m[4]).toUpperCase(),n=+(m[2]||m[3]);return n<1?null:n+' '+(era==='AD'||era==='AC'||era==='CE'?ERA_A:ERA_B);}
  m=/^(-?)(\d+)$/.exec(t);if(m){const n=+m[2];return n<1?null:n+' '+(m[1]?ERA_B:ERA_A);}
  return null;}
function dateFromCell(c){
  c=(c||'').trim();if(!c)return '';
  if(/[a-z]/i.test(c)){const d=parseDate(c);return d===null?c:d;}
  const n=parseFloat(c.replace(/[^\d.\-]/g,''));return isNaN(n)?c:yearLabel(Math.round(n));}
function applySample(mode,ri,v){
  const dt=parseDate(v.tmrca);if(dt===null)return {err:'Date: type a year such as 1500 AC or 850 BC (a plain number is read as AC, a minus sign as BC).'};
  v.tmrca=dt;
  const pid=+v.parent;if(!(pid>=0&&N[pid]))return {err:'Choose a subclade.'};if(!v.label.trim())return {err:'Sample ID is required.'};
  const path=N[pid].p.slice(),hint=focus===-1?[]:N[focus].p.slice();
  if(mode==='add')ROWS.push(mkRow(v.type,path,fSample(v)));else Object.assign(ROWS[ri],{type:v.type,path:path},fSample(v));
  return {hint:hint};}
function delNode(nid){
  const n=N[nid];let subs=0,smp=0;(function w(i){subs++;smp+=N[i].s.length;N[i].k.forEach(w);})(nid);
  if(!confirm('Delete '+n.p.join(' > ')+' and everything below it ('+(subs-1)+' subclades, '+smp+' samples)?'))return;
  const cur=focus===-1?[]:N[focus].p.slice();ROWS=ROWS.filter(r=>!startsWith(r.path,n.p));commit(cur);}
function delSample(ri){
  if(!confirm('Delete sample '+(ROWS[ri].label||'(no ID)')+'?'))return;
  const hint=focus===-1?[]:N[focus].p.slice();ROWS.splice(ri,1);commit(hint);}
function doAct(act,nid,ri){
  if(!EDITABLE){alert(EDIT_MSG);return;}
  if(act==='editN')formNode('edit',nid);else if(act==='addN')formNode('add',nid);
  else if(act==='addS')formSample('add',nid,-1);else if(act==='editS')formSample('edit',-1,ri);
  else if(act==='delN')delNode(nid);else if(act==='delS')delSample(ri);}
async function api(kind){
  const body=JSON.stringify({rows:ROWS.map(r=>{const o={};COLS.forEach(c=>o[c]=c==='path'?r.path.join(' > '):(r[c]||''));return o;})});
  const res=await fetch('/api/'+kind,{method:'POST',headers:{'Content-Type':'application/json','X-Token':TOKEN},body:body});
  if(!res.ok)throw new Error(await res.text());return res.json();}
function applyData(r,hint){
  const fp=(hint||(focus===-1?[]:N[focus].p)).slice();
  D=r.data;N=D.nodes;ROOTS=D.roots;FL=D.flags;
  if(r.rows)ROWS=r.rows.map(x=>Object.assign({},x,{path:splitPath(x.path)}));
  let id=idByPath(fp);while(id<0&&fp.length){fp.pop();id=idByPath(fp);}
  focus=id;trail=id===-1?[]:pathIds(id);
  history.replaceState(null,'',id===-1?location.pathname+location.search:'#'+encodeURIComponent(pathIds(id).map(i=>N[i].n).join('>')));
  setWarnings(r.warnings);render();}
async function commit(hint){
  dirty=true;updateBar('updating...');
  try{applyData(await api('preview'),hint);}catch(e){alert('Could not update the view: '+e.message);}
  updateBar();}
async function saveAll(){
  if(!dirty||!SERVER)return;updateBar('saving...');
  try{const r=await api('save');applyData(r);dirty=false;savedMsg='\u2713 saved to '+FILE+(r.backup?' (backup: '+r.backup+')':'');}
  catch(e){alert('Save failed: '+e.message);}
  updateBar();}
function discardAll(){if(!dirty||!confirm('Discard all unsaved changes?'))return;dirty=false;location.reload();}
function toggleEdit(){if(!EDITABLE){alert(EDIT_MSG);return;}editing=!editing;document.body.classList.toggle('editing',editing);document.getElementById('editbtn').classList.toggle('on',editing);}
function updateBar(msg){
  const sb=document.getElementById('savebtn');if(!sb)return;
  sb.disabled=!dirty;document.getElementById('discardbtn').disabled=!dirty;
  document.getElementById('status').textContent=msg||(dirty?'\u25cf unsaved changes':savedMsg);}
function setWarnings(l){
  const w=document.getElementById('warn');if(!l||!l.length){w.innerHTML='';return;}
  w.innerHTML='<details class="warnbox"><summary>\u26a0 '+l.length+' note'+(l.length>1?'s':'')+' about your data</summary>'+l.map(x=>'<div>'+E(x)+'</div>').join('')+'</details>';}
function initEdit(){
  window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
  document.addEventListener('keydown',e=>{
    const m=document.getElementById('modal');
    const so=document.getElementById('searchov');
    if(!so.hidden&&e.key==='Escape'){closeSearch();return;}
    if(e.target.id==='sq'&&e.key==='Enter'){e.preventDefault();doSearch();return;}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&SERVER){e.preventDefault();saveAll();return;}
    if(!m.hidden&&e.key==='Escape')closeModal();
    if(!m.hidden&&e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();document.getElementById('mok').click();}});}
function applyTheme(t){document.documentElement.dataset.theme=t;const b=document.getElementById('themebtn');if(b)b.classList.toggle('on',t==='dark');}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(t);try{localStorage.setItem('ytree-theme',t);}catch(e){}}
function expandAll(){collapsed.clear();render();}
function collapseAll(){
  collapsed.clear();N.forEach(n=>{if(n.k.length||n.s.length)collapsed.add(nk(n));});
  (focus===-1?ROOTS:[focus]).forEach(i=>collapsed.delete(nk(N[i])));render();}
function snpTokens(n){
  const t=[];n.o.forEach(x=>x.split('/').forEach(y=>{y=y.trim();if(y)t.push(y);}));
  const tail=n.n.indexOf('-')>=0?n.n.slice(n.n.indexOf('-')+1):n.n;
  [n.n,tail].forEach(x=>{if(x&&!t.some(y=>y.toUpperCase()===x.toUpperCase()))t.push(x);});return t;}
function openSearch(){const o=document.getElementById('searchov');o.hidden=false;const q=document.getElementById('sq');q.focus();q.select();}
function closeSearch(){document.getElementById('searchov').hidden=true;}
function doSearch(){
  const q=document.getElementById('sq').value.trim().toUpperCase(),out=document.getElementById('sres');
  if(!q){out.innerHTML='';return;}
  const ex=[],part=[];
  N.forEach((n,i)=>{const t=snpTokens(n).map(x=>x.toUpperCase());if(t.indexOf(q)>=0)ex.push(i);else if(t.some(x=>x.indexOf(q)>=0))part.push(i);});
  const hits=ex.length?ex:part.slice(0,50);
  if(!hits.length){out.innerHTML='<div class="snone">No subclade has an SNP called '+E(q)+'.</div>';return;}
  const hl=x=>x.toUpperCase().indexOf(q)>=0?'<b>'+E(x)+'</b>':E(x);
  out.innerHTML=(ex.length?'':'<div class="snone">No exact match - partial matches:</div>')+'<table class="stable">'+hits.map(i=>{
    const n=N[i],list=n.o.length?n.o:[n.n.indexOf('-')>=0?n.n.slice(n.n.indexOf('-')+1):n.n];
    return '<tr><td>\u2212 '+list.map(hl).join(' \u2022 ')+'</td><td><span class="clade" data-sid="'+i+'" title="Go to '+E(n.n)+'">'+E(n.n)+'</span></td></tr>';}).join('')+'</table>';}
function pathIds(id){const o=[];while(id!==-1){o.unshift(id);id=N[id].par;}return o;}
function render(){
  const ids=focus===-1?ROOTS:[focus];
  document.getElementById('classic').innerHTML='<div class="classic"><ul>'+ids.map(i=>classicLi(i,true)).join('')+'</ul></div>';
  document.getElementById('chart').innerHTML='<div class="chart"><ul>'+ids.map(i=>chartLi(i,true)).join('')+'</ul></div>';
  const fd=focus===-1?-1:trail.indexOf(focus);
  let h='<button class="crumb'+(focus===-1?' on':'')+'" data-id="-1">Home</button>';
  trail.forEach((id,i)=>{h+='<button class="crumb'+(i===fd?' on':'')+(i>fd?' dim':'')+'" data-id="'+id+'" title="'+E(N[id].p.join(' > '))+'">'+E(N[id].n)+'</button>';});
  document.getElementById('crumbs').innerHTML=h;
  let ns=0;N.forEach(n=>ns+=n.s.length);document.getElementById('stat').textContent=N.length+' subclades \u00b7 '+ns+' samples';}
function setFocus(id){
  focus=id;if(id!==-1){collapsed.delete(nk(N[id]));if(trail.indexOf(id)<0)trail=pathIds(id);}
  render();location.hash=id===-1?'':encodeURIComponent(pathIds(id).map(i=>N[i].n).join('>'));}
function applyHash(){
  const h=decodeURIComponent(location.hash.slice(1));let id=-1;
  if(h){let list=ROOTS,cur=-1;for(const nm of h.split('>')){const f=list.find(i=>N[i].n===nm);if(f===undefined){cur=-1;break;}cur=f;list=N[f].k;}id=cur;}
  if(id!==focus){focus=id;if(id!==-1&&trail.indexOf(id)<0)trail=pathIds(id);render();}}
function show(id,btn){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
document.addEventListener('click',e=>{
  const tg=e.target.closest('[data-tg]');
  if(tg){const k=nk(N[+tg.dataset.tg]);if(collapsed.has(k))collapsed.delete(k);else collapsed.add(k);render();return;}
  const sid=e.target.closest('[data-sid]');
  if(sid){closeSearch();setFocus(+sid.dataset.sid);return;}
  const a=e.target.closest('[data-act]');
  if(a){doAct(a.dataset.act,a.dataset.nid===undefined?-1:+a.dataset.nid,a.dataset.ri===undefined?-1:+a.dataset.ri);return;}
  const t=e.target.closest('[data-id]');if(t&&+t.dataset.id!==focus)setFocus(+t.dataset.id);});
window.addEventListener('hashchange',applyHash);
applyTheme(document.documentElement.dataset.theme||'light');initEdit();render();applyHash();updateBar();setWarnings(D.warnings||[]);
</script></body></html>
